# کوئری‌های سفارشی postgres_exporter (علاوه بر متریک‌های پیش‌فرض)
# این ConfigMap به postgres_exporter (که CNPG با enablePodMonitor به‌صورت توکار فعال می‌کند
# یا می‌توان جدا هم Deploy کرد) پاس داده می‌شود.

pg_replication_lag_seconds:
  query: |
    SELECT
      CASE WHEN pg_is_in_recovery() THEN
        EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))
      ELSE 0 END AS lag_seconds
  metrics:
    - lag_seconds:
        usage: "GAUGE"
        description: "ثانیه‌های تاخیر replication روی standby"

pg_stat_replication_count:
  query: "SELECT count(*) AS count FROM pg_stat_replication"
  metrics:
    - count:
        usage: "GAUGE"
        description: "تعداد standby های متصل و در حال streaming"

pg_transaction_anomaly:
  query: |
    SELECT
      relname,
      n_tup_ins, n_tup_upd, n_tup_del
    FROM pg_stat_user_tables
    WHERE relname = 'payment_transactions'
  metrics:
    - relname: { usage: "LABEL" }
    - n_tup_ins: { usage: "COUNTER", description: "تعداد insert تجمعی" }
    - n_tup_upd: { usage: "COUNTER", description: "تعداد update تجمعی" }
    - n_tup_del: { usage: "COUNTER", description: "تعداد delete تجمعی" }
